<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAA4 Quest | L'Odyssée Numérique</title>
    
    <!-- INFRASTRUCTURE MODULAIRE (IMPORT MAPS) -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.469.0?external=react",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>

    <!-- COMPILATEUR RUNTIME & STYLES -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
            },
            colors: {
              cyber: {
                black: '#030712',
                blue: '#3b82f6',
                purple: '#8b5cf6',
                orange: '#ea580c'
              }
            },
            animation: {
              'mesh': 'mesh 15s ease infinite alternate',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 4s ease-in-out infinite',
            },
            keyframes: {
              mesh: {
                '0%': { transform: 'scale(1) translate(0%, 0%)' },
                '50%': { transform: 'scale(1.2) translate(5%, 5%)' },
                '100%': { transform: 'scale(1) translate(0%, 0%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glow: {
                '0%, 100%': { opacity: '0.4', filter: 'blur(20px)' },
                '50%': { opacity: '0.8', filter: 'blur(40px)' },
              }
            }
          }
        }
      }
    </script>

    <style>
        :root { scroll-behavior: smooth; }
        body { 
            background-color: #030712; 
            color: #f8fafc; 
            overflow-x: hidden;
            font-family: 'Outfit', sans-serif;
        }
        
        /* Glassmorphism Classes */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .glass-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(234, 88, 12, 0.4);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Ambient Background */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(234, 88, 12, 0.05) 0%, transparent 50%);
        }

        .title-gradient {
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #ea580c; }
    </style>
</head>
<body>
    <div class="mesh-bg animate-mesh"></div>
    <div id="root"></div>

    <!-- LOGIQUE APPLICATIVE REACT 19 -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          ChevronRight, Award, Map, RefreshCcw, ShieldCheck, Users, Globe, 
          CheckCircle2, XCircle, Info, HelpCircle, User, MousePointer2, 
          ArrowRight, Shield, Trash2, Edit3, Search, Share2, Hand, 
          ShieldAlert, Lock, Mail, AlertTriangle, Trophy, Zap, Cpu, Terminal
        } from 'lucide-react';

        // --- COMPONENTS ---

        const Intro = ({ onStart }) => (
          <div className="min-h-[80vh] flex flex-col items-center justify-center text-center px-4 animate-in fade-in slide-in-from-bottom-12 duration-1000">
            <div className="relative mb-8">
              <div className="absolute -inset-4 bg-orange-600/20 rounded-full blur-3xl animate-glow"></div>
              <div className="relative glass px-6 py-2 rounded-full border border-orange-500/30 text-orange-400 font-bold tracking-[0.2em] text-sm">
                MISSION : UAA4 ODYSSÉE
              </div>
            </div>
            
            <h1 className="text-6xl md:text-9xl font-black mb-8 title-gradient leading-none tracking-tight font-serif italic">
              Identité <span className="text-orange-600 not-italic">&</span> Numérique
            </h1>
            
            <p className="text-xl md:text-2xl text-slate-400 mb-16 max-w-3xl font-light leading-relaxed">
              Une expérience immersive pour les élèves de <span className="text-white font-semibold">5e & 6e Technique</span>. 
              Maîtrisez votre image, protégez vos droits et dominez le futur numérique.
            </p>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-16 w-full max-w-5xl">
              {[
                { icon: Users, title: 'Sphère Sociale', color: 'text-blue-400', desc: 'Décoder les structures de groupes.' },
                { icon: Globe, title: 'Traces & Échos', color: 'text-purple-400', desc: 'Gérer son double numérique.' },
                { icon: ShieldCheck, title: 'Législation', color: 'text-orange-400', desc: 'Le bouclier du citoyen (RGPD).' }
              ].map((card, i) => (
                <div key={i} className="glass-card p-10 rounded-[2.5rem] flex flex-col items-center group">
                  <div className={`p-5 rounded-2xl bg-slate-900 mb-6 group-hover:scale-110 transition-transform ${card.color}`}>
                    <card.icon className="w-10 h-10" />
                  </div>
                  <h3 className="text-2xl font-bold mb-3">{card.title}</h3>
                  <p className="text-slate-500 text-sm leading-relaxed">{card.desc}</p>
                </div>
              ))}
            </div>

            <button 
              onClick={onStart} 
              className="group relative inline-flex items-center gap-4 bg-orange-600 text-white px-12 py-6 rounded-full font-black text-2xl hover:bg-orange-700 transition-all shadow-[0_0_50px_rgba(234,88,12,0.4)] hover:shadow-[0_0_70px_rgba(234,88,12,0.6)] transform hover:scale-105 active:scale-95"
            >
              Initialiser la Quête <ChevronRight className="w-8 h-8 group-hover:translate-x-2 transition-transform" />
            </button>
          </div>
        );

        const MissionOne = ({ onComplete }) => {
          const ITEMS = [
            { id: '1', text: "Ma Famille", type: 'primaire' },
            { id: '2', text: "Passagers d'un train", type: 'agregat' },
            { id: '3', text: "Les belges de 18 ans", type: 'statistique' },
            { id: '4', text: "Cercle d'amis proches", type: 'primaire' },
            { id: '5', text: "Syndicat étudiant", type: 'secondaire' },
            { id: '6', text: "Foule dans une manif", type: 'agregat' },
          ];
          const [cur, setCur] = useState(0);
          const [feedback, setFeedback] = useState(null);

          const select = (type) => {
            const ok = ITEMS[cur].type === type;
            setFeedback(ok);
            setTimeout(() => {
              setFeedback(null);
              if (cur < ITEMS.length - 1) setCur(c => c + 1);
              else onComplete(100);
            }, 800);
          };

          return (
            <div className="max-w-4xl mx-auto py-12 animate-in slide-in-from-right-12 duration-700">
              <div className="flex justify-between items-end mb-16">
                <div>
                  <h2 className="text-4xl font-bold text-orange-600 mb-2">Mission 01</h2>
                  <h3 className="text-5xl font-black italic font-serif">Structures Sociales</h3>
                </div>
                <div className="text-2xl font-mono text-slate-500">{cur + 1} / {ITEMS.length}</div>
              </div>

              <div className="grid md:grid-cols-2 gap-12 items-center">
                <div className="relative">
                  <div className="glass p-16 rounded-[3rem] h-80 flex flex-col items-center justify-center text-center transition-all border-2 border-dashed border-slate-700">
                    {feedback !== null && (
                      <div className={`absolute inset-0 rounded-[3rem] flex items-center justify-center animate-in zoom-in ${feedback ? 'bg-emerald-500/10' : 'bg-red-500/10'}`}>
                        {feedback ? <CheckCircle2 className="w-24 h-24 text-emerald-500" /> : <XCircle className="w-24 h-24 text-red-500" />}
                      </div>
                    )}
                    <HelpCircle className="w-16 h-16 text-slate-700 mb-6" />
                    <span className="text-4xl font-black">{ITEMS[cur].text}</span>
                  </div>
                </div>
                <div className="grid grid-cols-1 gap-4">
                  {[
                    { id: 'agregat', label: 'Agrégat', d: 'Proximité physique seule.' },
                    { id: 'statistique', label: 'Catégorie Statistique', d: 'Critère commun sans lien.' },
                    { id: 'primaire', label: 'Groupe Primaire', d: 'Échanges intenses et directs.' },
                    { id: 'secondaire', label: 'Groupe Secondaire', d: 'Relations formelles et but précis.' }
                  ].map(cat => (
                    <button key={cat.id} onClick={() => select(cat.id)} className="glass-card p-6 rounded-3xl text-left">
                      <div className="font-black text-xl mb-1">{cat.label}</div>
                      <div className="text-slate-500 text-xs uppercase tracking-widest">{cat.d}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        const MissionTwo = ({ onComplete }) => {
          const ELEMENTS = [
            { id: '1', text: "Mon ADN", cat: 'perso' },
            { id: '2', text: "Mon club de foot", cat: 'coll' },
            { id: '3', text: "Mon style musical", cat: 'perso' },
            { id: '4', text: "Mes groupes Discord", cat: 'coll' },
            { id: '5', text: "Mon école (St-Luc)", cat: 'coll' },
            { id: '6', text: "Mes empreintes", cat: 'perso' },
          ];
          const [placed, setPlaced] = useState({});
          const curItem = ELEMENTS.find(e => !placed[e.id]);

          const place = (cat) => {
            if (curItem.cat === cat) {
              const next = { ...placed, [curItem.id]: true };
              setPlaced(next);
              if (Object.keys(next).length === ELEMENTS.length) setTimeout(() => onComplete(100), 1000);
            }
          };

          if (!curItem) return <div className="text-center py-40"><Trophy className="w-24 h-24 text-orange-500 mx-auto animate-bounce" /></div>;

          return (
            <div className="max-w-5xl mx-auto py-12 animate-in slide-in-from-right-12 duration-700">
               <h2 className="text-5xl font-black text-center mb-16 title-gradient font-serif italic">Dualité de l'Être</h2>
               <div className="flex flex-col items-center gap-12">
                 <div className="glass p-12 rounded-[2.5rem] shadow-2xl border-orange-500/20 border min-w-[300px] text-center">
                    <span className="text-4xl font-black text-white">{curItem.text}</span>
                 </div>
                 <div className="grid grid-cols-2 gap-8 w-full">
                    <button onClick={() => place('perso')} className="glass-card p-12 rounded-[3rem] flex flex-col items-center gap-4">
                      <User className="w-12 h-12 text-blue-400" />
                      <span className="font-black text-2xl">Identité Personnelle</span>
                    </button>
                    <button onClick={() => place('coll')} className="glass-card p-12 rounded-[3rem] flex flex-col items-center gap-4">
                      <Users className="w-12 h-12 text-orange-400" />
                      <span className="font-black text-2xl">Identité Collective</span>
                    </button>
                 </div>
               </div>
            </div>
          );
        };

        const Summary = ({ score, onRestart }) => (
          <div className="max-w-4xl mx-auto py-20 text-center animate-in zoom-in duration-1000">
             <div className="relative inline-block mb-12">
                <div className="absolute -inset-8 bg-orange-600/30 rounded-full blur-3xl animate-glow"></div>
                <Trophy className="w-32 h-32 text-orange-500 relative" />
             </div>
             <h2 className="text-7xl font-black mb-6 italic font-serif">Quête Accomplie</h2>
             <p className="text-2xl text-slate-400 mb-16">L'unité UAA4 n'a plus de secrets pour vous.</p>
             
             <div className="glass p-16 rounded-[4rem] mb-16 border-slate-700/50">
                <span className="text-slate-500 font-bold uppercase tracking-[0.3em] block mb-4">Potentiel Numérique</span>
                <span className="text-9xl font-black title-gradient">{score} <span className="text-3xl text-slate-700 font-normal">pts</span></span>
             </div>

             <div className="flex justify-center gap-8">
                <button onClick={onRestart} className="flex items-center gap-4 bg-orange-600 text-white px-10 py-5 rounded-full font-black text-xl hover:bg-orange-700 transition-all shadow-xl transform hover:scale-105">
                   <RefreshCcw className="w-6 h-6" /> Réinitialiser le Système
                </button>
                <button onClick={() => window.print()} className="flex items-center gap-4 glass text-white px-10 py-5 rounded-full font-black text-xl hover:bg-white/10 transition-all">
                   <Share2 className="w-6 h-6" /> Certifier mon Score
                </button>
             </div>
          </div>
        );

        // --- MAIN APPLICATION ---

        const App = () => {
          const [level, setLevel] = useState('intro');
          const [score, setScore] = useState(0);

          const handleComplete = (s) => {
            setScore(prev => prev + s);
            if (level === 'mission1') setLevel('mission2');
            else if (level === 'mission2') setLevel('summary');
          };

          return (
            <div className="min-h-screen flex flex-col p-6 md:p-12">
              <nav className="glass sticky top-8 z-[60] px-8 py-4 rounded-3xl flex justify-between items-center mb-12 max-w-7xl mx-auto w-full border border-white/10">
                <div className="flex items-center gap-4">
                  <div className="bg-orange-600 p-2 rounded-xl shadow-[0_0_20px_rgba(234,88,12,0.3)]"><Zap className="text-white w-6 h-6" /></div>
                  <h1 className="text-xl font-black tracking-tighter uppercase italic">UAA4 Quest</h1>
                </div>
                <div className="flex items-center gap-6">
                  <div className="flex items-center gap-2 bg-slate-900/50 px-4 py-2 rounded-xl border border-white/5">
                    <Award className="text-orange-500 w-5 h-5" />
                    <span className="font-mono font-bold text-lg">{score}</span>
                  </div>
                </div>
              </nav>

              <main className="flex-grow container mx-auto">
                {level === 'intro' && <Intro onStart={() => setLevel('mission1')} />}
                {level === 'mission1' && <MissionOne onComplete={handleComplete} />}
                {level === 'mission2' && <MissionTwo onComplete={handleComplete} />}
                {level === 'summary' && <Summary score={score} onRestart={() => window.location.reload()} />}
              </main>

              <footer className="mt-20 py-8 border-t border-white/5 text-center text-slate-600 text-xs font-bold uppercase tracking-[0.5em]">
                Institut Saint-Luc Frameries • 6e Technique • 2024-2025
              </footer>
            </div>
          );
        };

        // BOOTSTRAP RUNTIME
        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
